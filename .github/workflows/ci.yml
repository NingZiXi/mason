name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    name: 前端(类型检查 + 单元测试)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 类型检查
        run: npx vue-tsc --noEmit
      - name: 单元测试(Gerber 解析器等)
        run: npx vitest run

  geometry:
    name: 几何验证(build123d 三部件几何 + TS/Python 布局一致性)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装几何依赖
        run: pip install -r python/requirements.txt pytest
      - name: 运行几何验证测试
        run: python python/tests/run_all.py
      - name: 运行几何回归测试(pytest)
        run: python -m pytest python/test_jig_generator.py -q

  rust:
    name: Rust (Tauri 后端编译检查)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf
      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: 编译检查
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: 项目保存加载回归测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib project_tests
