name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    env:
      # AppImage 在无 FUSE 的 CI 环境下需要解包运行
      APPIMAGE_EXTRACT_AND_RUN: 1

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            file \
            libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release version and signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Missing TAURI_SIGNING_PRIVATE_KEY secret"; exit 1; }
          node scripts/prepare-release.mjs --check-version "${GITHUB_REF_NAME}"

      - name: Build bundled Python environment (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: npm run build:python-env

      - name: Build bundled Python environment (Unix)
        if: matrix.platform != 'windows-latest'
        run: bash scripts/build-python-env.sh

      - name: Build Tauri app
        if: matrix.platform != 'ubuntu-latest'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri:build

      - name: Build Tauri app (Linux, including updater AppImage)
        if: matrix.platform == 'ubuntu-latest'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri:build -- --bundles deb,rpm,appimage

      - name: Collect artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/msi/*.msi artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/nsis/*.exe artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/nsis/*.exe.zip artifacts/
          cp src-tauri/target/release/bundle/nsis/*.exe.zip.sig artifacts/

      - name: Collect artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/dmg/*.dmg artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/macos/*.app.tar.gz artifacts/
          cp src-tauri/target/release/bundle/macos/*.app.tar.gz.sig artifacts/
          # .app 是目录 bundle,打包成 zip 以便上传
          cd src-tauri/target/release/bundle/macos
          for app in *.app; do
            [ -d "$app" ] && zip -r "../../../../../artifacts/${app%.app}.zip" "$app"
          done

      - name: Collect artifacts (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/deb/*.deb artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/rpm/*.rpm artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage artifacts/
          cp src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz artifacts/
          cp src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mason-${{ matrix.platform }}
          path: artifacts/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare signed assets and updater manifest
        run: node scripts/prepare-release.mjs artifacts release "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}"

      - name: Resolve curated release notes
        id: notes
        run: |
          f="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then
            echo "path=$f" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release (curated notes)
        if: steps.notes.outputs.path != ''
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: ${{ steps.notes.outputs.path }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      - name: Create Release (auto notes)
        if: steps.notes.outputs.path == ''
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

  sync-site-version:
    name: Sync site version badge
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # 基于master操作(而非tag),push 回 master 才不会 non-fast-forward;
          # tag 打在发版提交上,树内容一致
          ref: master

      # 官网版本号硬编码在 HTML 里(API 被墙时的兜底显示),
      # 发版后自动把两处 span 同步为新 tag,防止人为遗忘
      - name: Update hardcoded version in docs/index.html
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          sed -i "s|id=\"hero-ver-num\">[^<]*</span>|id=\"hero-ver-num\">${TAG}</span>|" docs/index.html
          sed -i "s|id=\"dl-ver-num\">[^<]*</span>|id=\"dl-ver-num\">${TAG}</span>|" docs/index.html
          grep -n "hero-ver-num\|dl-ver-num" docs/index.html

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Site version already up to date."
          else
            git add docs/index.html
            git commit -m "chore(site): sync site version to ${GITHUB_REF_NAME}"
            git push
          fi
